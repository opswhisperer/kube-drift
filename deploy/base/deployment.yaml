apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-drift
  namespace: kube-drift
  labels:
    app.kubernetes.io/name: kube-drift
    app.kubernetes.io/part-of: kube-drift
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-drift
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-drift
        app.kubernetes.io/part-of: kube-drift
    spec:
      serviceAccountName: kube-drift
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-drift
          image: kube-drift  # set by `images:` in kustomization.yaml
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: CONFIG
              value: /config/config.yaml
            - name: STATE_FILE
              value: /data/drift.json
            - name: DATA_DIR
              value: /data
            - name: HOME
              value: /tmp
            - name: LOG_LEVEL
              value: INFO
            # kube-drift protects its own resources from delete commands
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Optional: raises the GitHub API limit from 60/h to 5000/h. Create it with
            # kubectl create secret generic kube-drift-credentials --from-literal=github-token=…
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kube-drift-credentials
                  key: github-token
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          resources:
            # kor runs as a child process during orphan scans
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: kube-drift-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: kube-drift-data
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
