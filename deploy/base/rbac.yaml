apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-drift
  namespace: kube-drift
  labels:
    app.kubernetes.io/name: kube-drift
    app.kubernetes.io/part-of: kube-drift
---
# Read-only. `secrets` is needed to decode Helm release records (type helm.sh/release.v1);
# RBAC cannot filter by Secret type, so this grants read on all Secrets cluster-wide.
# The rest is what kor reads to decide whether something is orphaned, plus Gateways and
# cert-manager issuers (references kor doesn't follow).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-drift-reader
  labels:
    app.kubernetes.io/name: kube-drift
    app.kubernetes.io/part-of: kube-drift
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "secrets", "configmaps", "services", "endpoints", "serviceaccounts",
                "persistentvolumeclaims", "persistentvolumes", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers"]
    verbs: ["get", "list"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "clusterissuers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-drift-reader
  labels:
    app.kubernetes.io/name: kube-drift
    app.kubernetes.io/part-of: kube-drift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-drift-reader
subjects:
  - kind: ServiceAccount
    name: kube-drift
    namespace: kube-drift
