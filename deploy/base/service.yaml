apiVersion: v1
kind: Service
metadata:
  name: kube-drift
  namespace: kube-drift
  labels:
    app.kubernetes.io/name: kube-drift
    app.kubernetes.io/part-of: kube-drift
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-drift
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
