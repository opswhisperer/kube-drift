<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kube-drift</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
/* Update size is the main signal: a warm ramp from major (red) to patch (ochre). Everything that
   isn't behind stays quiet so the drift reads first. Lookup errors are violet so they never pass
   for a major update. */
:root{
  --bg:#f1f3f5; --panel:#ffffff; --ink:#141a21; --muted:#56606d; --faint:#8b95a1; --line:#dbe0e6;
  --accent:#0d6b67; --accent-ink:#ffffff;
  --major:#b42318; --major-bg:#fde7e4; --minor:#b5520a; --minor-bg:#fdecd9; --patch:#866400; --patch-bg:#f6edcb;
  --other:#8a5a2e; --other-bg:#f3e8dc;
  --ok:#1b6e45; --ok-bg:#e2f1e8; --ok-bar:#a9d8bd; --unk:#56606d; --unk-bg:#e8ebef; --unk-bar:#c3cad3;
  --err:#7a3db0; --err-bg:#efe5f8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1115; --panel:#151a20; --ink:#e4e8ec; --muted:#9aa3ae; --faint:#6c7682; --line:#28303a;
  --accent:#4cc2b6; --accent-ink:#0d1115;
  --major:#ff8b7d; --major-bg:#3a1613; --minor:#f5a65c; --minor-bg:#38230f; --patch:#e2c25c; --patch-bg:#30290e;
  --other:#d8a87c; --other-bg:#33251a;
  --ok:#66c992; --ok-bg:#12301f; --ok-bar:#2b5e43; --unk:#9aa3ae; --unk-bg:#222932; --unk-bar:#3a434e;
  --err:#c9a0f2; --err-bg:#2b1d3c;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tr:focus-visible{outline-offset:-2px}
code,.v{font-family:var(--mono);font-size:12.5px}
.spacer{flex:1}

/* header */
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--muted);font-weight:450;margin-left:6px}
.meta{color:var(--muted);font-size:13px}
.out{display:flex;gap:14px;align-items:baseline;font-size:13px}
.out a{color:var(--muted);text-decoration:none} .out a:hover{color:var(--accent);text-decoration:underline}
#who{display:inline-flex;gap:14px;align-items:baseline;color:var(--muted)} #who[hidden]{display:none}
#who-name{max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit}
button:hover{border-color:var(--faint)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button:disabled{opacity:.55;cursor:default}
button.link{border:0;background:none;padding:0 2px;color:var(--accent);font-size:inherit}
main{padding:18px 24px 40px;max-width:1400px;margin:0 auto}

/* tabs */
.tabs{display:flex;gap:2px;margin:0 0 22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px 9px;color:var(--muted);font-weight:600}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .cnt{display:inline-block;margin-left:7px;padding:0 7px;border-radius:999px;background:var(--unk-bg);color:var(--unk);font-size:12px;font-weight:600}
.tab .cnt.hot{background:var(--minor-bg);color:var(--minor)}
.tab .cnt:empty{display:none}

/* the drift strip: one sentence and one proportional bar whose segments are filters */
.strip{margin:0 0 20px}
.headline{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin:0 0 10px}
.headline .big{font-size:22px;font-weight:650;letter-spacing:-.015em;line-height:1.25;background:none;border:0;padding:0;color:var(--ink);text-align:left}
.headline .big.on{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.headline .parts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.headline .parts button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}
.headline .parts button.on{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.headline .parts b{font-weight:650}
.bar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden}
.bar button{flex:var(--n) 1 0;min-width:6px;border:0;border-radius:0;padding:0;cursor:pointer;background:var(--c)}
.bar button:hover{filter:brightness(1.08) saturate(1.1)}
.bar button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.bar.dim button:not(.on){opacity:.35}
.headline .note{font-size:13px;color:var(--muted)}
.key{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:baseline}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px;gap:2px}
.seg button{border:0;border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted);background:none}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
input[type=search],select{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:8px;font:inherit;font-size:13.5px;min-width:0}
input[type=search]{width:240px}
label.tog{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:12.5px}

/* tables */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
th{font-size:12.5px;font-weight:600;color:var(--muted);border-top:0;white-space:nowrap}
th button{border:0;background:none;padding:0;color:inherit;font:inherit}
th button:hover{color:var(--ink)}
th[aria-sort] button::after{content:" ↓";color:var(--accent)} th[aria-sort=ascending] button::after{content:" ↑"}
.name{font-weight:600;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:12.5px}
.sub > span + span{margin-left:10px}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.chev{display:inline-block;width:12px;margin-left:6px;color:var(--faint);transition:transform .12s}
tr[aria-expanded=true] .chev{transform:rotate(90deg)}
tr.child td{background:color-mix(in srgb,var(--line) 22%,transparent)}
tr.child td:first-child{padding-left:26px}
tr.child .name{font-weight:500}
tr.grp td{background:var(--bg);font-weight:600;cursor:pointer;user-select:none;padding:7px 12px}
tr.grp .sub{font-weight:400;margin-left:10px}
tr.grp .chev{margin:0 6px 0 0}
tr.grp[aria-expanded=true] .chev{transform:rotate(90deg)}
tr.detail td{background:color-mix(in srgb,var(--line) 30%,transparent);padding:12px 12px 14px 26px}
tr.detail dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;margin:0;font-size:12.5px}
tr.detail dt{color:var(--muted)}
tr.detail dd{margin:0;overflow-wrap:anywhere}
tr.detail dd.v{font-size:12px}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}

/* versions */
.badge{display:inline-block;padding:1px 8px;border-radius:5px;font-size:12px;font-weight:650;white-space:nowrap;background:var(--bg-c);color:var(--c)}
.s-major{--c:var(--major);--bg-c:var(--major-bg)} .s-minor{--c:var(--minor);--bg-c:var(--minor-bg)}
.s-patch{--c:var(--patch);--bg-c:var(--patch-bg)} .s-other{--c:var(--other);--bg-c:var(--other-bg)}
.s-current{--c:var(--ok);--bg-c:transparent} .s-unknown{--c:var(--unk);--bg-c:var(--unk-bg)} .s-error{--c:var(--err);--bg-c:var(--err-bg)}
.badge.s-current{padding-left:0;font-weight:550}
.ver{overflow-wrap:anywhere}
.ver .from{color:var(--muted)}
.ver .lbl{color:var(--muted);font-size:12.5px;margin-right:6px}
.reno{margin-top:4px;font-size:12.5px}
.reno button{padding:1px 8px;font-size:12px}
.ver .to{color:var(--c);font-weight:650}
.ver .arrow{color:var(--faint);margin:0 5px}
.imgs-out{color:var(--minor)}
.incompat{color:var(--major)}
button#showinc[aria-pressed=true],button#showign[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.ignored-note{font-style:italic}
tr.detail .dacts{margin-top:10px;display:flex;gap:8px}
.scopes input[type=number]{width:72px}

/* orphans */
.o-orphan{--c:var(--minor);--bg-c:var(--minor-bg)} .o-in-use{--c:var(--ok);--bg-c:var(--ok-bg)}
.o-managed{--c:var(--accent);--bg-c:color-mix(in srgb,var(--accent) 13%,transparent)}
.o-protected{--c:var(--unk);--bg-c:var(--unk-bg)} .o-ignored{--c:var(--faint);--bg-c:var(--unk-bg)}
tr.ign td{opacity:.6}
td.ck,th.ck{width:34px;padding-right:0;cursor:default}
.acts{white-space:nowrap;text-align:right}
.acts button{padding:3px 9px;font-size:12.5px}
button.danger:hover,button.danger:focus-visible{color:var(--major);border-color:var(--major)}
@media (hover:hover){
  #o-rows tr .acts > *{opacity:0;transition:opacity .1s}
  #o-rows tr:hover .acts > *,#o-rows tr:focus-within .acts > *,#o-rows tr.sel .acts > *{opacity:1}
}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;padding:8px 12px;border:1px solid var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.bulk[hidden],.filters[hidden]{display:none}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;background:var(--unk-bg);color:var(--muted)}
.ev{margin:5px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.ev li{display:flex;gap:10px;margin-top:3px}
.tag{flex:none;width:76px;font-size:12px;font-weight:650;color:var(--faint)}
.ev .in-use .tag{color:var(--ok)} .ev .recreated .tag{color:var(--accent)} .ev .leftover .tag{color:var(--minor)} .ev .protected .tag{color:var(--unk)}
.kor{display:flex;gap:10px}

/* config */
.intro{margin:0 0 6px;color:var(--muted);max-width:60em}
h2.ch{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:15px;margin:26px 0 4px}
h2.ch button{font-size:12.5px;padding:3px 10px;font-weight:500}
h2.ch + .hint{margin:0 0 10px;max-width:60em}
.ckey{font-family:var(--mono);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.from{display:inline-block;padding:0 7px;border-radius:5px;font-size:12px;font-weight:600;background:var(--unk-bg);color:var(--unk)}
.from.dash{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.cset{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
.cset section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.cset h3{margin:0 0 6px;font-size:13px} .cset h3 code{color:var(--muted);font-weight:400;margin-left:6px}
pre.cfg{margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.cform{display:grid;gap:10px}
.cform label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.cform label > .hint{font-size:12px}
.cform select{width:100%}
.cform [hidden]{display:none!important}
.cform .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){ .cform .pair{grid-template-columns:1fr} }

/* dialog, toast */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 24px 64px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(8,12,16,.5)}
dialog form{padding:18px 20px;display:grid;gap:12px}
dialog h2{margin:0;font-size:16px}
dialog .body{font-size:13px;max-height:50vh;overflow:auto}
dialog ul.list{margin:6px 0;padding-left:18px;font-family:var(--mono);font-size:12px}
.scopes{display:grid;gap:6px;margin:10px 0 4px}
.scopes label{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.scopes label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.scopes .n{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.rules{width:100%;font-size:12.5px}
.rules td{padding:7px 6px;border-top:1px solid var(--line)}
.newkey{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px} .newkey input{flex:1 1 12em;min-width:0}
dialog pre.script{margin:8px 0 0;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
dialog .warn{background:var(--minor-bg);color:var(--minor);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:12.5px}
dialog input[type=text],dialog input[type=url],dialog textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 10px;border-radius:8px;font:inherit}
dialog .row{display:flex;flex-direction:row-reverse;gap:8px}
.toast{position:fixed;right:16px;bottom:16px;max-width:min(440px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:10}
.toast[hidden]{display:none}
.scanning{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1s infinite alternate;margin-right:6px}
@keyframes p{from{opacity:.3}to{opacity:1}}

@media (max-width:760px){
  header{padding:12px 16px} main{padding:14px 16px 32px}
  .hide-sm{display:none}
  .headline .big{font-size:19px}
  .filters > *{flex:1 1 auto} input[type=search]{width:100%}
  th,td{padding:9px 8px}
  .ver .arrow{margin:0 4px 0 2px} .ver .to{display:inline-block}
  th:first-child{width:auto!important}
  .acts{white-space:normal;width:76px} .acts button{display:block;width:100%;margin:0 0 4px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header>
  <h1>kube-drift<span id="cluster"></span></h1>
  <div class="meta" id="meta" aria-live="polite">loading…</div>
  <div class="spacer"></div>
  <nav class="out" aria-label="downloads and API">
    <a id="version" href="https://github.com/opswhisperer/kube-drift/releases" target="_blank" rel="noopener" title="kube-drift version" hidden></a>
    <a id="csv" href="/api/drift.csv">CSV</a>
    <a id="json" href="/api/drift" target="_blank">JSON</a>
    <a href="/docs">API docs</a>
    <span id="who" hidden><button class="link" id="keys" type="button">API keys</button> <span id="who-name"></span> <button class="link" id="signout" type="button">Sign out</button></span>
  </nav>
  <button class="primary" id="rescan">Rescan</button>
</header>
<main>
  <nav class="tabs" role="tablist">
    <button class="tab on" data-view="versions" role="tab" aria-selected="true">Version drift <span class="cnt" id="cnt-versions"></span></button>
    <button class="tab" data-view="orphans" role="tab" aria-selected="false">Orphaned<span class="hide-sm"> resources</span> <span class="cnt" id="cnt-orphans"></span></button>
    <button class="tab" data-view="config" role="tab" aria-selected="false">Config</button>
  </nav>
  <section id="v-versions">
  <div class="strip" id="strip"></div>
  <div class="filters">
    <div class="seg" role="group" aria-label="type">
      <button data-cat="" aria-pressed="true">All</button>
      <button data-cat="cluster" aria-pressed="false">Cluster</button>
      <button data-cat="node" aria-pressed="false">Nodes</button>
      <button data-cat="helm" aria-pressed="false">Helm releases</button>
      <button data-cat="manifest" aria-pressed="false">Manifests</button>
      <button data-cat="helm-workload" aria-pressed="false" title="Every image inside a Helm release, listed on its own">Helm images</button>
    </div>
    <select id="ns" aria-label="namespace"><option value="">All namespaces</option></select>
    <select id="group" aria-label="group by">
      <option value="">No grouping</option>
      <option value="namespace">Group by namespace</option>
      <option value="category">Group by type</option>
      <option value="status">Group by status</option>
      <option value="update">Group by update size</option>
      <option value="install">Group by install method</option>
      <option value="owner">Group by GitHub owner</option>
      <option value="image_host">Group by registry</option>
      <option value="tagstyle">Group by tag style</option>
    </select>
    <input type="search" id="q" placeholder="Search name, image or version" aria-label="search">
    <button id="showign" aria-pressed="false" title="Updates you chose to ignore for a while" hidden></button>
    <button id="showinc" aria-pressed="false" title="Updates this cluster can't install, such as a chart that needs a newer Kubernetes" hidden></button>
    <span class="hint" id="count"></span>
  </div>
  <div class="tablewrap">
  <table>
    <thead><tr>
      <th data-k="status" style="width:96px"><button>Status</button></th>
      <th data-k="name"><button>Component</button></th>
      <th data-k="installed"><button>Version</button></th>
      <th class="hide-sm">Release notes</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
  </section>

  <section id="v-orphans" hidden>
  <div id="o-banner"></div>
  <div class="strip" id="o-strip"></div>
  <div class="filters">
    <select id="o-kind" aria-label="kind"><option value="">All kinds</option></select>
    <select id="o-ns" aria-label="namespace"><option value="">All namespaces</option></select>
    <input type="search" id="o-q" placeholder="Search name or reason" aria-label="search">
    <label class="tog"><input type="checkbox" id="o-showign"> Show ignored</label>
    <button class="link" id="o-rules">Ignore rules</button>
    <span class="hint" id="o-count"></span>
  </div>
  <div class="bulk" id="o-bulk" hidden>
    <strong id="o-selcount"></strong>
    <button data-bulk="ignore">Ignore</button>
    <button data-bulk="unignore">Unignore</button>
    <button data-bulk="export">Export command</button>
    <button data-bulk="delete" class="danger">Delete command</button>
    <span class="spacer"></span>
    <button data-bulk="clear">Clear selection</button>
  </div>
  <div class="tablewrap">
  <table id="o-table">
    <thead><tr>
      <th class="ck"><input type="checkbox" id="o-all" aria-label="select all shown"></th>
      <th data-ok="status" style="width:110px"><button>Status</button></th>
      <th data-ok="name"><button>Resource</button></th>
      <th data-ok="reason" class="hide-sm"><button>Why it's flagged</button></th>
      <th data-ok="created" class="hide-sm" style="width:70px"><button>Age</button></th>
      <th style="width:1%"><span class="hide-sm" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Actions</span></th>
    </tr></thead>
    <tbody id="o-rows"></tbody>
  </table>
  </div>
  </section>

  <section id="v-config" hidden><div id="c-body"><p class="hint">Loading the config…</p></div></section>
</main>

<dialog id="dlg"><form method="dialog" id="dlg-form">
  <h2 id="dlg-title"></h2>
  <div class="body" id="dlg-body"></div>
  <div class="row"><button value="ok" id="dlg-ok" class="primary">OK</button><button value="cancel" id="dlg-cancel" formnovalidate>Cancel</button></div>
</form></dialog>
<div class="toast" id="toast" hidden></div>
<script>
const $ = s => document.querySelector(s);
const state = { data:null, cat:'', ns:'', q:'', tile:'', group:'', showInc:false, showIgn:false, shut:new Set(), sort:'status', asc:true, open:new Set() };
try{ state.group=localStorage.getItem('kd.group')||''; state.showInc=localStorage.getItem('kd.showinc')==='1'; state.showIgn=localStorage.getItem('kd.showign')==='1'; }catch{}
const ost = { data:null, view:'versions', tile:'', kind:'', ns:'', q:'', showIgn:false, sort:'status', asc:true, sel:new Set() };
const CAT = { cluster:'Cluster', node:'Node', helm:'Helm release', manifest:'Manifest', 'helm-workload':'Helm image' };
// Worst first: what you'd act on, then what kube-drift couldn't check, then what's fine.
const SEV = { major:0, minor:1, patch:2, other:3, error:4, unknown:5, current:6 };
const SEV_LABEL = { major:'major', minor:'minor', patch:'patch', other:'outdated', error:'error', unknown:'unknown', current:'current' };
const SEV_TITLE = { major:'A new major version is available', minor:'A new minor version is available', patch:'A new patch release is available',
  other:'A newer image or version is available', error:"The upstream lookup failed", unknown:"kube-drift can't tell which version is newest", current:'Up to date' };
const ORDER = { outdated:0, error:1, unknown:2, current:3 };

function rel(iso){ if(!iso) return '—'; const s=(Date.now()-new Date(iso))/1000; if(s<60) return 'just now';
  if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' h ago'; return Math.round(s/86400)+' d ago'; }
function until(iso){ if(!iso) return ''; const s=(new Date(iso)-Date.now())/1000; return s<=0?'soon':(s<3600?Math.round(s/60)+' min':Math.round(s/3600*10)/10+' h'); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const nsLabel = n => n==='-'?'cluster-wide':n;
const subLine = parts => `<div class="sub">${parts.filter(Boolean).map(p=>`<span>${p}</span>`).join('')}</div>`;

// Which version part an outdated component has to move: major, minor or patch; "other" when the
// versions aren't numeric (floating tags) or differ only past the patch number.
function updateSize(c){
  if(c.status!=='outdated') return '';
  const num=v=>{ const m=/\d+(?:\.\d+)*/.exec(v||''); return m?m[0].split('.').map(Number):null; };
  const a=num(c.running_version||c.installed), b=num(c.latest);
  if(!a||!b||a[0]>99999||b[0]>99999) return 'other';  // a build stamp (20261008-0811) has no major/minor
  return ['major','minor','patch'].find((_,i)=>(a[i]||0)!==(b[i]||0))||'other';
}
const sev = c => updateSize(c) || (c.status in SEV ? c.status : 'unknown');

function badge(c){ const s=sev(c); return `<span class="badge s-${s}" title="${esc(SEV_TITLE[s])}">${SEV_LABEL[s]}</span>`; }
function versionCell(c){
  const cur=c.running_version||c.installed, s=sev(c), behind=c.status==='outdated' && c.latest && c.latest!==cur;
  let h=`<div class="ver s-${s}">${c.category==='helm'?'<span class="lbl">chart</span>':''}<span class="v ${behind?'from':''}">${esc(cur)||'—'}</span>`+
    (behind?` <span class="arrow" aria-label="can update to">→</span> <span class="v to">${esc(c.latest)}</span>`:'')+'</div>';
  const sub=[];
  if(c.running_version) sub.push(`tag <code>${esc(c.installed)}</code>, version asked from the app`);
  if(c.category==='helm' && c.installed_app) sub.push(`app ${esc(c.installed_app)}${behind && c.latest_app && c.latest_app!==c.installed_app?' → '+esc(c.latest_app):''}`);
  if(c.floating && !c.running_version) sub.push(c.digest_current===true?'floating tag, running its current image':c.digest_current===false?'floating tag, a newer image is behind it':'floating tag');
  if(c.latest_any && c.latest_any!==c.latest) sub.push(`${esc(c.latest_any)} outside your track`);
  if(c.incompatible) sub.push(`<span class="incompat">Not compatible: ${esc(c.incompatible)}</span>`);
  if(c.ignored) sub.push(`<span class="ignored-note">${esc(ignoreText(c.ignored))}</span>`);
  if(!c.latest && c.status!=='outdated') sub.push(c.error?'lookup failed':c.source&&c.source.type==='none'?'not tracked':c.status==='current'?'':
    c.digest_error?`registry said ${esc(c.digest_error)}`:c.digest_current===true?'image matches its tag, no comparable version found':'no comparable version found');
  return h+(sub.filter(Boolean).length?subLine(sub):'')+renoLine(c);
}
// Renovate (renovate.enabled): an update waiting for approval gets an Upgrade button (it ticks the box in the
// repository's Dependency Dashboard), an open PR its link. Tracked and untracked rows say so only when expanded.
function renoLine(c){
  const r=c.renovate; if(!r || r.state==='tracked' || r.state==='untracked') return '';
  if(r.state==='approve') return `<div class="reno">${state.data.renovate?.can_approve
    ? `<button data-reno="${esc(c.id)}" title="${esc(r.title||'')} · ${esc(r.repo)}">Upgrade to ${esc(r.new)}…</button>`
    : `<span class="hint">Renovate: waiting for approval in ${esc(r.repo)}</span>`}</div>`;
  if(r.state==='pr') return `<div class="reno"><a href="${esc(r.pr_url)}" target="_blank" rel="noopener">Renovate PR #${esc(String(r.pr))}</a></div>`;
  return `<div class="reno"><span class="hint">Renovate: ${esc(r.result||'pending')}</span></div>`;
}
function renoText(r){
  if(!r) return '';
  const where=r.repo?` in ${r.repo}${r.file?` (${r.file})`:''}`:'';
  const also=r.also_in?.length?` · same image also in ${r.also_in.join(', ')}`:'';
  switch(r.state){
    case 'approve': return `update to ${r.new} waiting for approval${where} · branch ${r.branch}${also}`;
    case 'pr': return `PR #${r.pr} open${where}${also}`;
    case 'pending': return `${r.result||'pending'}${where} · branch ${r.branch}${also}`;
    case 'tracked': return `tracked${where}, nothing pending${r.skipped?` (skipped: ${r.skipped})`:''}${also}`;
    default: return 'not tracked by Renovate';
  }
}
async function approveReno(id){
  const c=(state.data.components||[]).find(x=>x.id===id), r=c?.renovate; if(!r) return;
  const res=await modal({title:`Upgrade ${c.name} to ${r.new}`, ok:'Approve',
    body:`<p>Approves <b>${esc(r.title||r.branch)}</b> in <code>${esc(r.repo)}</code>: kube-drift ticks its box in the repository's Dependency Dashboard, and Renovate opens the PR. Nothing in the cluster changes until that PR is merged.</p>`});
  if(!res.ok) return;
  const out=await call('/api/renovate/approve',{repo:r.repo, branch:r.branch});
  toast(out.status==='approved'?`Approved: Renovate opens the PR in ${esc(r.repo)}`:'It was already approved');
  // until Renovate's next report says the PR is open, show it as approved (no second click)
  (state.data.components||[]).filter(x=>x.renovate?.repo===r.repo && x.renovate?.branch===r.branch)
    .forEach(x=>{ x.renovate.state='pending'; x.renovate.result='approved, PR coming'; });
  render();
  setTimeout(load,60000);
}
// "Ignored until Oct 20 or until something newer than 1.12.4 is out — note": an ignore ends at its first condition met.
function ignoreText(ig){
  if(ig.via) return 'Ignored with its Helm release';
  const until=[ig.until&&'until '+new Date(ig.until).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),
    ig.kube_version&&`until Kubernetes moves off ${ig.kube_version}`, ig.until_newer&&`until something newer than ${ig.latest||'this image'} is out`].filter(Boolean);
  return 'Ignored '+until.join(' or ')+(ig.note?' — '+ig.note:'');
}
function refCell(c){
  const links=[]; if(c.ref) links.push(`<a href="${esc(c.ref)}" target="_blank" rel="noopener">${esc(host(c.ref))}</a>`);
  if(c.ref_ah && c.ref_ah!==c.ref) links.push(`<a href="${esc(c.ref_ah)}" target="_blank" rel="noopener">ArtifactHub</a>`);
  return links.join('<br>') || '<span class="hint">—</span>';
}
function host(u){ try{ const h=new URL(u).hostname.replace(/^www\./,''); const p=new URL(u).pathname.split('/').filter(Boolean); return h==='github.com'&&p.length>=2?`${p[0]}/${p[1]}`:h; }catch{ return u; } }
// An Argo CD release's Application, and what it deployed against what it targets.
function argoText(a){
  if(!a) return '';
  return `Application ${a.application}${a.source_index!=null?`, source ${a.source_index}`:''} · `+
    (a.deployed?(a.sync_status||'sync status unknown'):'not synced yet')+(a.target_revision?`, targets ${a.target_revision}`:'')+
    (a.replaced_secret_version?` · replaces a stale Helm release Secret at ${a.replaced_secret_version}`:'');
}
function describeSource(c){
  const s=c.source||{};
  switch(s.type){
    case 'registry': return 'newest tag of the same shape in its registry';
    case 'artifacthub': return `ArtifactHub chart ${s.repo}/${s.chart||c.image.replace(/^chart /,'')}`;
    case 'artifacthub-search': return `ArtifactHub search for “${s.chart||c.image.replace(/^chart /,'')}”`+(s.repo_url?` from ${s.repo_url}`:'');
    case 'github': return `GitHub releases of ${s.repo}`;
    case 'k8s': return 'Kubernetes release channel';
    case 'oci': return `chart tags at ${s.ref}`;
    case 'none': return 'not tracked (config)';
    default: return JSON.stringify(s);
  }
}

function showCluster(name){ if(!name) return; $('#cluster').textContent=name; document.title='kube-drift · '+name; }
// kube-drift's own version; an exact release links to its release notes.
function showVersion(v){
  const a=$('#version'); if(!v || a.dataset.v===v) return;
  a.dataset.v=v; a.textContent=v; a.hidden=false;
  a.href='https://github.com/opswhisperer/kube-drift/releases'+(/^v\d+\.\d+\.\d+$/.test(v)?'/tag/'+encodeURIComponent(v):'');
}
function setMeta(d, noun, busy){
  $('#meta').innerHTML=(d.scanning?`<span class="scanning"></span>${busy}. `:'')+
    (d.scanned_at?`Last ${noun} ${rel(d.scanned_at)}`:(d.scanning?'':`No ${noun} yet`))+
    (d.kor_version?`, kor ${esc(d.kor_version)}`:'')+
    (d.next_scan_at&&!d.scanning?`, next in ${until(d.next_scan_at)}`:'')+
    (d.last_error?`. <span style="color:var(--major)">Last scan failed: ${esc(d.last_error)}</span>`:'')+
    (d.argocd?.errors?.length?`. <span style="color:var(--major)">Can't read Argo CD Applications: ${esc(d.argocd.errors.join('; '))}</span>`:'');
  $('#rescan').disabled=!!d.scanning;
}

// The strip: a sentence and a bar. Segments filter the table; picking the active one clears it.
function strip(el, {headline, headOn, headKey, parts, segs, active, attr}){
  const any=segs.some(x=>x.n);
  el.innerHTML=`<div class="headline"><button class="big ${headOn?'on':''}" ${attr}="${headKey}" aria-pressed="${!!headOn}">${headline}</button>
    <div class="parts">${parts.map(p=>p.n?`<button ${attr}="${p.k}" aria-pressed="${active===p.k}" class="${active===p.k?'on':''}"><span class="key" style="--c:var(${p.c})"></span><b>${p.n}</b> ${esc(p.l)}</button>`:'').join('')}</div></div>`+
    (any?`<div class="bar ${active?'dim':''}">${segs.filter(x=>x.n).map(x=>`<button ${attr}="${x.k}" style="--n:${x.n};--c:var(${x.c})" class="${active===x.k?'on':''}" aria-pressed="${active===x.k}" aria-label="${x.n} ${esc(x.l)}" title="${x.n} ${esc(x.l)}"></button>`).join('')}</div>`:'');
}

function render(){
  const d=state.data; if(!d) return;
  showCluster(d.cluster); showVersion(d.version);
  if(ost.view!=='orphans') setMeta(d,'scan','Scanning');
  // An update the cluster can't install (c.incompatible says why) is hidden unless asked for.
  // So is one you ignored for a while (c.ignored), until its ignore ends.
  const inc=(d.components||[]).filter(c=>c.incompatible).length, ign=(d.components||[]).filter(c=>c.ignored&&!c.release).length;
  const all=(d.components||[]).filter(c=>(state.showInc||!c.incompatible)&&(state.showIgn||!c.ignored));
  const sib=$('#showinc'); sib.hidden=!inc; sib.setAttribute('aria-pressed',state.showInc);
  sib.textContent=state.showInc?'Hide incompatible':`Show ${inc} incompatible`;
  const gib=$('#showign'); gib.hidden=!ign; gib.setAttribute('aria-pressed',state.showIgn);
  gib.textContent=state.showIgn?'Hide ignored':`Show ${ign} ignored`;
  const top=all.filter(c=>!c.release);
  const out=top.filter(c=>c.status==='outdated').length; $('#cnt-versions').textContent=out||''; $('#cnt-versions').classList.toggle('hot',out>0);
  // Helm-managed containers are listed under their release (expand it), not on their own.
  const kids=new Map(); all.forEach(c=>{ if(c.release){ if(!kids.has(c.release)) kids.set(c.release,[]); kids.get(c.release).push(c); } });
  kids.forEach(v=>v.sort((a,b)=>SEV[sev(a)]-SEV[sev(b)]||(a.name+a.image).localeCompare(b.name+b.image)));
  // strip
  const n={}; top.forEach(c=>{ const s=sev(c); n[s]=(n[s]||0)+1; });
  const imgRel=top.filter(c=>c.status!=='outdated' && c.images_outdated).length;
  const seg=(k,l,c)=>({k,l,c,n:n[k]||0});
  const segs=[seg('major','major','--major'),seg('minor','minor','--minor'),seg('patch','patch','--patch'),seg('other','other updates','--other'),
    seg('error','lookup errors','--err'),seg('unknown','unknown','--unk-bar'),seg('current','current','--ok-bar')];
  strip($('#strip'),{
    headline: !d.scanned_at? (d.scanning?'Scanning the cluster…':'No scan yet') : out? `${out} of ${top.length} behind upstream` : `All ${top.length} components are current`,
    headOn: state.tile==='outdated', headKey:'outdated', attr:'data-t', active:state.tile,
    parts:[seg('major','major','--major'),seg('minor','minor','--minor'),seg('patch','patch','--patch'),seg('other','other','--other'),
      seg('error','lookup errors','--err'),seg('unknown','unknown','--unk-bar')],
    segs,
  });
  if(ign && !state.showIgn) $('#strip .headline').insertAdjacentHTML('beforeend',`<span class="note">${ign} ignored</span>`);
  if(inc && !state.showInc) $('#strip .headline').insertAdjacentHTML('beforeend',`<span class="note">${inc} incompatible update${inc===1?'':'s'} hidden</span>`);
  if(imgRel) $('#strip .headline').insertAdjacentHTML('beforeend',`<span class="note">${imgRel} more Helm release${imgRel===1?' ships':'s ship'} outdated images</span>`);
  const reno=new Set(all.filter(c=>c.renovate?.state==='approve').map(c=>c.renovate.repo+' '+c.renovate.branch)).size;
  if(reno) $('#strip .headline').insertAdjacentHTML('beforeend',`<span class="note">${reno} Renovate update${reno===1?'':'s'} waiting for approval</span>`);
  // namespaces
  const nsSel=$('#ns'); const cur=nsSel.value; const nss=[...new Set(all.map(c=>c.namespace))].sort();
  nsSel.innerHTML='<option value="">All namespaces</option>'+nss.map(n=>`<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(nsLabel(n))}</option>`).join('');
  // filter
  const hay=x=>[x.name,x.namespace,x.image,x.installed,x.latest,x.running_version,x.note].join(' ').toLowerCase();
  let rows=all.filter(c=>{
    if(state.cat? c.category!==state.cat : c.release) return false;
    if(state.ns && c.namespace!==state.ns) return false;
    if(state.tile==='outdated'){ if(c.status!=='outdated' && !c.images_outdated) return false; }
    else if(state.tile && sev(c)!==state.tile) return false;
    if(state.q && !hay(c).includes(state.q) && !(state.cat? [] : kids.get(c.id)||[]).some(k=>hay(k).includes(state.q))) return false;
    return true;
  });
  const k=state.sort; rows.sort((a,b)=>{ let x=k==='status'?SEV[sev(a)]:(a[k]||''), y=k==='status'?SEV[sev(b)]:(b[k]||'');
    if(x<y) return state.asc?-1:1; if(x>y) return state.asc?1:-1; return (a.namespace+a.name).localeCompare(b.namespace+b.name); });
  $('#count').textContent=`${rows.length} shown`;
  document.querySelectorAll('th[data-k]').forEach(th=>{ th.dataset.k===k? th.setAttribute('aria-sort',state.asc?'ascending':'descending') : th.removeAttribute('aria-sort'); });
  const rowHtml = (c,child)=>{
    const open=state.open.has(c.id), ks=!child&&!state.cat? kids.get(c.id)||[] : [];
    const imgs=ks.length?`${ks.length} image${ks.length===1?'':'s'}`+(c.images_outdated?`, <span class="imgs-out">${c.images_outdated} outdated</span>`:''):'';
    const row=`<tr class="row${child?' child':''}" data-id="${esc(c.id)}" tabindex="0" aria-expanded="${open}">
      <td>${badge(c)}</td>
      <td><div class="name">${esc(c.name)}<span class="chev" aria-hidden="true">›</span></div>${subLine([child?'':esc(nsLabel(c.namespace)),esc(c.kind),esc(c.note),imgs])}</td>
      <td>${versionCell(c)}</td><td class="hide-sm">${refCell(c)}</td></tr>`;
    if(!open) return row;
    const dl=[['Ignored',c.ignored&&ignoreText(c.ignored).replace(/^Ignored /,'')],['Not compatible',c.incompatible],['Installed by',c.install],['Argo CD',argoText(c.argocd)],['Renovate',renoText(c.renovate)],['Image',c.image],['Version from',describeSource(c)],['Config rule',c.config_key&&`${c.category==='helm'?'helm':'images'} › ${c.config_key}`],['Track',c.track&&c.track!=='any'?`same ${c.track} version only`:''],
      ['Running digest',(c.running_digests||[]).join(', ')||c.pinned_digest],['Registry digest',c.remote_digest],
      ['Version probe',c.probe_error||(c.running_version?'ok':'')],['Error',c.error||c.digest_error],['Checked',c.checked_at&&rel(c.checked_at)],['ID',c.id]]
      .filter(([,v])=>v).map(([k,v])=>`<dt>${k}</dt><dd class="${/digest|ID|Image/.test(k)?'v':''}">${esc(v)}</dd>`).join('');
    const canIgn=d.ignore_enabled && !c.release && (c.ignored || c.status==='outdated' || c.images_outdated);
    const canCfg=d.ignore_enabled && !!ruleKey(c);
    const acts=!canIgn&&!canCfg?'':`<div class="dacts">${!canIgn?'':c.ignored?`<button data-unign="${esc(c.id)}">Stop ignoring</button>`:`<button data-ign="${esc(c.id)}">Ignore this update…</button>`}`+
      (canCfg?`<button data-cfg="${esc(c.id)}" title="Set its track, where newer versions come from, its link…">Configure…</button>`:'')+'</div>';
    return row+`<tr class="detail"><td colspan="4"><dl>${dl}</dl>${acts}</td></tr>`+ks.map(k=>rowHtml(k,true)).join('');
  };
  $('#rows').innerHTML = !rows.length? `<tr><td colspan="4" class="empty">${d.scanned_at?'Nothing matches these filters.':'Waiting for the first scan.'}</td></tr>`
    : !state.group? rows.map(c=>rowHtml(c)).join('') : groupRows(rows).map(([key,items])=>{
      const shut=state.shut.has(key), out=state.group==='status'||state.group==='update'?0:items.filter(c=>c.status==='outdated').length;
      const label=state.group==='category'?CAT[key]||key:state.group==='namespace'?nsLabel(key):key||GROUP_NONE[state.group]||'—';
      return `<tr class="grp" data-g="${esc(key)}" tabindex="0" aria-expanded="${!shut}"><td colspan="4"><span class="chev" aria-hidden="true">›</span>${esc(label)}<span class="sub">${items.length}${out?`, ${out} outdated`:''}</span></td></tr>`
        +(shut?'':items.map(c=>rowHtml(c)).join(''));
    }).join('');
}
const GROUP_NONE = { update:'not outdated', owner:'not on GitHub', image_host:'not an image', tagstyle:'not an image' };
const GROUP_ORDER = { status:ORDER, update:{ major:0, minor:1, patch:2, other:3 } };
const GROUP_KEY = { update:updateSize, owner:ghOwner, tagstyle:c=>c.category==='helm'?'chart version':!c.image_host?'':c.pinned_digest?'pinned digest':c.floating?'floating tag':'version tag' };
// GitHub org/user behind a component: its GitHub release source, else a github.com reference link, else a ghcr.io image.
function ghOwner(c){
  if(c.source?.type==='github' && c.source.repo) return c.source.repo.split('/')[0].toLowerCase();
  for(const u of [c.ref,c.ref_ah]){ const m=/^https?:\/\/(?:www\.)?github\.com\/([^/?#]+)/i.exec(u||''); if(m) return m[1].toLowerCase(); }
  return c.image_host==='ghcr.io' && c.image_repo? c.image_repo.split('/')[0].toLowerCase() : '';
}
// Buckets the already-sorted rows by the group-by field; rows keep their sort order inside a group.
function groupRows(rows){
  const g=new Map(); rows.forEach(c=>{ const k=(GROUP_KEY[state.group]?GROUP_KEY[state.group](c):c[state.group])??''; if(!g.has(k)) g.set(k,[]); g.get(k).push(c); });
  return [...g].sort(([a],[b])=>(!a-!b)||(GROUP_ORDER[state.group]?(GROUP_ORDER[state.group][a]??9)-(GROUP_ORDER[state.group][b]??9):0)||String(a).localeCompare(String(b)));
}

// Built-in sign-in (auth.oidc): an expired session makes the API answer 401; sign in again and come back.
function signIn(){ location.href='/auth/login?next='+encodeURIComponent(location.pathname+location.hash); }
async function get(path){ const r=await fetch(path,{cache:'no-store'}); if(r.status===401){ signIn(); throw new Error('signed out'); } return r.json(); }
async function load(){ try{ state.data=await get('/api/drift'); render(); if(ost.view==='config') renderC(); }catch(e){ $('#meta').textContent='Cannot reach the kube-drift API: '+e; } }
// Rows and group headers are focusable: Enter or Space toggles them like a click.
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('tr.row,tr.grp')){ e.preventDefault(); e.target.click(); }
});
function refocus(sel){ const el=document.querySelector(sel); if(el) el.focus({preventScroll:true}); }
document.addEventListener('click',e=>{
  if(!e.target.closest('#v-versions')) return;
  const chip=e.target.closest('[data-cat]'); if(chip){ state.cat=chip.dataset.cat; document.querySelectorAll('[data-cat]').forEach(c=>c.setAttribute('aria-pressed',c===chip)); render(); return; }
  const tile=e.target.closest('[data-t]'); if(tile){ const t=tile.dataset.t; state.tile=state.tile===t?'':t; render(); refocus(`#strip .headline [data-t="${t}"]`); return; }
  const th=e.target.closest('th[data-k]'); if(th){ if(state.sort===th.dataset.k) state.asc=!state.asc; else { state.sort=th.dataset.k; state.asc=true; } render(); refocus(`th[data-k="${th.dataset.k}"] button`); return; }
  const grp=e.target.closest('tr.grp'); if(grp){ const g=grp.dataset.g; state.shut.has(g)?state.shut.delete(g):state.shut.add(g); render(); refocus(`tr.grp[data-g="${CSS.escape(g)}"]`); return; }
  const rb=e.target.closest('[data-reno]'); if(rb){ approveReno(rb.dataset.reno).catch(err=>toast('Approve failed: '+esc(err.message))); return; }
  const ib=e.target.closest('[data-ign]'); if(ib){ ignoreUpdate(ib.dataset.ign).catch(err=>toast('Ignore failed: '+esc(err.message))); return; }
  const cb=e.target.closest('[data-cfg]'); if(cb){ run(()=>configure(cb.dataset.cfg)); return; }
  const ub=e.target.closest('[data-unign]'); if(ub){ call('/api/drift/unignore',{ids:[ub.dataset.unign]}).then(()=>{ toast('Showing its updates again'); return load(); })
    .catch(err=>toast('Failed: '+esc(err.message))); return; }
  const row=e.target.closest('tr.row'); if(row && !e.target.closest('a')){ const id=row.dataset.id; state.open.has(id)?state.open.delete(id):state.open.add(id); render(); refocus(`tr.row[data-id="${CSS.escape(id)}"]`); }
});
$('#ns').addEventListener('change',e=>{ state.ns=e.target.value; render(); });
$('#group').value=state.group;
$('#group').addEventListener('change',e=>{ state.group=e.target.value; state.shut.clear(); try{ localStorage.setItem('kd.group',state.group); }catch{} render(); });

// Ignore a component's update until the first chosen condition: N days, a Kubernetes version change, or the next version.
async function ignoreUpdate(id){
  const comps=state.data.components||[], c=comps.find(x=>x.id===id); if(!c) return;
  const kube=(comps.find(x=>x.id==='cluster/kubernetes')||{}).installed;
  const r=await modal({title:`Ignore ${c.name}${c.latest?' → '+c.latest:''}`, ok:'Ignore',
    body:`<p>Hides this update until the first of these happens:</p><div class="scopes">
      ${c.latest||c.remote_digest?`<label><input type="checkbox" id="ig-newer" checked><span>${c.latest?`Something newer than ${esc(c.latest)} comes out`:'The tag gets a newer image'}</span></label>`:''}
      <label><input type="checkbox" id="ig-days-on" ${c.latest||c.remote_digest?'':'checked'}><span>For <input type="number" id="ig-days" value="30" min="1" max="3650" aria-label="days"> days</span></label>
      ${kube?`<label><input type="checkbox" id="ig-kube"><span>Kubernetes moves off ${esc(kube)}</span></label>`:''}</div>`,
    input:'<input type="text" id="dlg-field" placeholder="note (optional) — why wait?">'});
  if(!r.ok) return;
  const body={ids:[id], note:r.value};
  if($('#ig-days-on').checked) body.days=parseInt($('#ig-days').value,10);
  if($('#ig-kube')?.checked) body.until_kube_change=true;
  if($('#ig-newer')?.checked) body.until_newer=true;
  if(!body.days && !body.until_kube_change && !body.until_newer){ toast('Pick at least one condition'); return; }
  const res=await call('/api/drift/ignore',body);
  toast(res.ignored?`Ignored ${esc(c.name)}`:esc(res.skipped[0]?.why||'Not ignored'));
  await load();
}

const OORDER = { orphan:0, managed:1, 'in-use':2, protected:3, ignored:4 };
const OSEG = [['orphan','orphaned','--minor'],['in-use','in use (kor missed it)','--ok-bar'],['managed','managed (would come back)','--accent'],['protected','protected','--unk-bar'],['ignored','ignored','--line']];
const BADGE = { 'in-use':['in use','Something uses it that kor does not check — kor is wrong here'], managed:['managed','Its owner would put it back if you deleted it'],
  orphan:['orphan','Nothing uses or manages it'], protected:['protected','Never offered a delete command'], ignored:['ignored','Hidden from the counts'] };
const TAG = { 'in-use':'In use', recreated:'Recreated', leftover:'Leftover', gone:'Gone?' };
function age(iso){ if(!iso) return '—'; const d=(Date.now()-new Date(iso))/86400000; return d<1?Math.max(1,Math.round(d*24))+'h':d<60?Math.round(d)+'d':Math.round(d/30)+'mo'; }
function ostatus(i){ return i.ignored?'ignored':i.status; }
function toast(msg,ms=5000){ const t=$('#toast'); t.innerHTML=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,ms); }

function modal({title, body, ok='OK', input=null}){
  const dlg=$('#dlg'); $('#dlg-title').textContent=title;
  $('#dlg-body').innerHTML=body+(input?`<div style="margin-top:10px">${input}</div>`:'');
  const okb=$('#dlg-ok'); okb.textContent=ok||''; okb.className='primary'; okb.hidden=!ok;
  $('#dlg-cancel').textContent=ok?'Cancel':'Close';
  okb.disabled=false;
  // resolve on submit/cancel rather than `close`, which browsers defer while the page is hidden
  return new Promise(res=>{
    const form=$('#dlg-form'), done=v=>{ form.onsubmit=dlg.oncancel=null; const f=$('#dlg-field'); res(v==='ok'?{ok:true,value:f?f.value:''}:{ok:false}); };
    form.onsubmit=e=>done(e.submitter?e.submitter.value:'ok'); dlg.oncancel=()=>done('cancel');
    dlg.showModal(); ($('#dlg-field')||$('#dlg-copy')||okb).focus({preventScroll:true}); $('#dlg-body').scrollTop=0; });
}

async function call(path, body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401){ signIn(); throw new Error('signed out'); }
  if(!r.ok){ let m=r.statusText; try{ m=(await r.json()).error||m; }catch{} throw new Error(m); }
  return r.json();
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch{ const r=document.createRange(); r.selectNodeContents($('#dlg-script')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); return false; }
}
function byId(id){ return (ost.data?.items||[]).find(i=>i.id===id); }
function label(i){ return `${i.kind} ${i.namespace?i.namespace+'/':''}${i.name}`; }

/* ---- ignore rules: same matching as app/orphans.py rule_match ---- */
const SRC = { gateway:'used by a Gateway (TLS)', 'cert-manager-issuer':'used by a cert-manager issuer', 'cert-manager':'issued by cert-manager',
  helm:'owned by an installed Helm release', 'helm-leftover':'left over from an uninstalled Helm release', argocd:'managed by Argo CD' };
const srcText=x=>SRC[x]||(x.startsWith('managed-by:')?'managed by '+x.slice(11):x);
const plural=k=>/(s|x)$/.test(k)?k+'es':/[^aeiou]y$/.test(k)?k.slice(0,-1)+'ies':k+'s';
function describeRule(r){
  return [r.kind?plural(r.kind):'Anything', r.source?srcText(r.source):'', r.namespace?`in ${r.namespace}`:'',
    r.name?`named ${r.name}`:'', r.name_regex?`named /${r.name_regex}/`:''].filter(Boolean).join(' ');
}
function matchRule(r,i){
  if(r.kind && r.kind!==i.kind) return false;
  if(r.namespace && r.namespace!==i.namespace) return false;
  if(r.name && r.name!==i.name) return false;
  if(r.source && !(i.hints||[]).some(h=>h.source===r.source)) return false;
  if(r.name_regex){ try{ if(!new RegExp(r.name_regex).test(i.name)) return false; }catch{ return false; } }
  return true;
}
function suggestRules(items){
  const out=[], seen=new Set(), add=r=>{ const k=JSON.stringify(r); if(!seen.has(k)){ seen.add(k); out.push(r); } };
  const kinds=new Set(items.map(i=>i.kind)), nss=new Set(items.map(i=>i.namespace));
  const common=[...new Set((items[0].hints||[]).map(h=>h.source))].filter(x=>x && x!=='gone' && items.every(i=>(i.hints||[]).some(h=>h.source===x)));
  const kind=kinds.size===1?[...kinds][0]:null, ns=nss.size===1?[...nss][0]:null;
  for(const x of common){ if(kind) add({kind, source:x}); add({source:x}); }
  if(kind && ns) add({kind, namespace:ns});
  if(ns) add({namespace:ns});
  return out.slice(0,5);
}
async function doIgnore(ids){
  const items=ids.map(byId).filter(Boolean); if(!items.length) return;
  const all=ost.data.items||[], n=items.length;
  const scopes=[{label:n===1?'Only this resource':`Only these ${n} resources`, rule:null, count:n}]
    .concat(suggestRules(items).map(r=>({label:describeRule(r), rule:r, count:all.filter(i=>matchRule(r,i)).length})))
    // "Anything <source>" only earns a row when it reaches more than "<Kind>s <source>"
    .filter((x,k,a)=>!(x.rule && !x.rule.kind && x.rule.source && a.some(y=>y.rule?.kind && y.rule.source===x.rule.source && y.count===x.count)));
  const r=await modal({title:`Ignore ${n===1?label(items[0]):n+' resources'}`, ok:'Ignore',
    body:`<p>Ignored resources are hidden from the counts until you unignore them. A rule also covers matching resources found in later scans.</p>
      <div class="scopes">${scopes.map((x,k)=>`<label><input type="radio" name="scope" value="${k}" ${k?'':'checked'}><span>${esc(x.label)}</span><span class="n">${x.count} now</span></label>`).join('')}</div>`,
    input:'<input type="text" id="dlg-field" placeholder="note (optional) — why is this fine?">'});
  if(!r.ok) return;
  const pick=scopes[+(document.querySelector('input[name=scope]:checked')?.value||0)];
  if(pick.rule){ await call('/api/orphans/rules',{rule:pick.rule,note:r.value}); toast(`Rule added: ${esc(pick.label)} (${pick.count})`); }
  else { const res=await call('/api/orphans/ignore',{ids,note:r.value}); toast(`Ignored ${res.ignored}`); }
  ost.sel.clear(); await loadO();
}
function ruleOf(i){ return (ost.data.rules||[]).find(r=>r.id===i.ignored?.rule); }
async function showRules(){
  const rules=ost.data.rules||[];
  const rows=rules.map(r=>`<tr><td><div>${esc(describeRule(r))}</div><div class="sub">${r.from==='config'?'config file':'added '+rel(r.at)}${r.note?' — '+esc(r.note):''}</div></td>
    <td class="sub" style="white-space:nowrap">${r.matches} match${r.matches===1?'':'es'}</td>
    <td>${r.from==='dashboard'?`<button type="button" data-rule-del="${esc(r.id)}">Remove</button>`:''}</td></tr>`).join('');
  await modal({title:'Ignore rules', ok:null, body:rules.length?`<p>Resources matching a rule are hidden from the counts. Add one from <b>Ignore</b> on any resource. Config rules are edited in the config file.</p><table class="rules">${rows}</table>`
    :'<p>No rules yet. Choose <b>Ignore</b> on a resource to ignore it, or everything like it.</p>'});
}

async function doUnignore(ids){ const res=await call('/api/orphans/unignore',{ids}); ost.sel.clear(); toast(`Unignored ${res.unignored}`); await loadO(); }
async function doCommands(ids, action){
  const items=ids.map(byId).filter(Boolean);
  const res=await call('/api/orphans/commands',{ids,action});
  const used=items.filter(i=>!res.skipped.some(x=>x.id===i.id)); const kinds=new Set(used.map(i=>i.kind));
  const warns=[];
  if(action==='delete'){
    const inUse=used.filter(i=>i.status==='in-use'), managed=used.filter(i=>i.status==='managed');
    if(inUse.length) warns.push(`${inUse.length} are in use by something kor doesn't check (e.g. a Gateway's TLS certificate) — deleting breaks it.`);
    if(managed.length) warns.push(`${managed.length} would be put back by their owner (Helm, cert-manager, an operator) — remove them there instead.`);
    if(kinds.has('PersistentVolumeClaim')||kinds.has('PersistentVolume')) warns.push('Volumes: the backup is the manifest only, not the data. A PV with reclaimPolicy Delete loses its data.');
    if(kinds.has('CustomResourceDefinition')) warns.push('Deleting a CRD deletes every object of that type.');
  }
  if(kinds.has('Secret')) warns.push('Secret backups contain the secret data; the script writes them with mode 600.');
  const n=used.length, what=action==='delete'?'Back up and delete':'Export';
  const body=!res.script?'<p>Nothing to do for this selection.</p>':
    `<p>${action==='delete'?'Each object is saved to a local JSON file, then deleted — only if its backup succeeded.':'Saves each object to a local JSON file.'} Server-owned fields are stripped, so <code>kubectl apply -f</code> restores them. Run it in a terminal with access to the cluster; needs <code>kubectl</code> and <code>jq</code>.</p>`+
    warns.map(w=>`<div class="warn">${esc(w)}</div>`).join('')+
    (res.skipped.length?`<p class="hint">Skipped: ${res.skipped.map(x=>esc(x.id)+' ('+esc(x.why)+')').join(', ')}</p>`:'')+
    `<div style="margin-top:10px"><button type="button" class="primary" id="dlg-copy">Copy command</button> <span class="hint" id="dlg-copied"></span></div><pre class="script" id="dlg-script">${esc(res.script)}</pre>`;
  const p=modal({title:`${what} ${n} resource${n===1?'':'s'}`, ok:null, body});
  const cb=$('#dlg-copy'); if(cb) cb.addEventListener('click',async()=>{ const ok=await copyText(res.script);
    $('#dlg-copied').textContent=ok?(action==='delete'?'Copied — run it, then Rescan here.':'Copied.'):'Selected — press ⌘C / Ctrl+C.'; });
  await p;
}
function renderO(){
  const d=ost.data; if(!d) return;
  if(ost.view==='orphans'){
    setMeta(d,'orphan scan','kor is scanning every namespace, which takes a few minutes');
  }
  const s=d.summary||{}; $('#cnt-orphans').textContent=s.orphan||''; $('#cnt-orphans').classList.toggle('hot',(s.orphan||0)>0);
  const ro=!d.ignore_enabled;
  $('#o-banner').innerHTML=(ro?`<div class="banner">Ignores can't be saved: the data directory isn't writable.</div>`:'')+
    ((d.warnings||[]).length?`<details class="banner"><summary>${d.warnings.length} scan warning(s)</summary><ul>${d.warnings.map(w=>`<li><code>${esc(w)}</code></li>`).join('')}</ul></details>`:'');
  const oseg=OSEG.map(([k,l,c])=>({k,l,c,n:s[k]||0})), no=s.orphan||0;
  strip($('#o-strip'),{
    headline: !d.scanned_at? (d.scanning?'kor is scanning the cluster…':'No orphan scan yet') : no? `${no} orphaned resource${no===1?'':'s'}` : 'No orphaned resources',
    headOn: ost.tile==='orphan', headKey:'orphan', attr:'data-ot', active:ost.tile, parts:oseg.slice(1), segs:oseg,
  });
  const all=d.items||[];
  const nsKey=i=>i.namespace||'(cluster-scoped)';
  const fill=(sel,vals,label)=>{ const cur=sel.value; sel.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join(''); };
  fill($('#o-kind'),[...new Set(all.map(i=>i.kind))].sort(),'All kinds');
  fill($('#o-ns'),[...new Set(all.map(nsKey))].sort(),'All namespaces');
  const showIgn=ost.showIgn||ost.tile==='ignored';
  let rows=all.filter(i=>{
    const st=ostatus(i);
    if(st==='ignored' && !showIgn) return false;
    if(ost.tile && st!==ost.tile) return false;
    if(ost.kind && i.kind!==ost.kind) return false;
    if(ost.ns && nsKey(i)!==ost.ns) return false;
    if(ost.q){ const h=[i.kind,i.namespace,i.name,i.reason,(i.hints||[]).map(h=>h.text).join(' '),i.ignored?.note].join(' ').toLowerCase(); if(!h.includes(ost.q)) return false; }
    return true;
  });
  const k=ost.sort; rows.sort((a,b)=>{ let x=k==='status'?OORDER[ostatus(a)]:(a[k]||''), y=k==='status'?OORDER[ostatus(b)]:(b[k]||'');
    if(k==='created'){ x=a.created||'9'; y=b.created||'9'; }
    if(x<y) return ost.asc?-1:1; if(x>y) return ost.asc?1:-1; return (a.kind+a.namespace+a.name).localeCompare(b.kind+b.namespace+b.name); });
  const ids=new Set(all.map(i=>i.id)); [...ost.sel].forEach(id=>{ if(!ids.has(id)) ost.sel.delete(id); });
  $('#o-count').textContent=`${rows.length} shown`;
  document.querySelectorAll('th[data-ok]').forEach(th=>{ th.dataset.ok===k? th.setAttribute('aria-sort',ost.asc?'ascending':'descending') : th.removeAttribute('aria-sort'); });
  $('#o-all').checked=rows.length>0 && rows.every(i=>ost.sel.has(i.id));
  $('#o-bulk').hidden=!ost.sel.size; $('#o-selcount').textContent=`${ost.sel.size} selected`;
  $('#o-rows').innerHTML=rows.length?rows.map(i=>{
    const st=ostatus(i), ign=!!i.ignored;
    const ev=(i.hints||[]).map(h=>[h.type,TAG[h.type]||h.type,h.text]);
    if(i.protected) ev.push(['protected','Protected',i.protected]);
    if(ign){ const rr=ruleOf(i);
      ev.push(['ignored','Ignored',(rr?`by ${i.ignored.by==='config'?'config ':''}rule “${describeRule(rr)}”`:rel(i.ignored.at))+(i.ignored.note?' — '+i.ignored.note:'')]); }
    const why=(i.reason?`<div class="kor"><span class="tag" title="what kor reported">kor</span><span>${esc(i.reason)}</span></div>`:'')+
      (ev.length?`<ul class="ev">${ev.map(([t,l,x])=>`<li class="${t}"><span class="tag">${esc(l)}</span><span>${esc(x)}</span></li>`).join('')}</ul>`:'');
    const acts=[ro?'':ign?(i.ignored.by==='dashboard'?`<button data-act="unignore">Unignore</button>`:`<button data-act="rules">Rule…</button>`):`<button data-act="ignore">Ignore</button>`,
      i.known_kind?`<button data-act="export" title="command to export as JSON">Export</button>`:'',
      i.known_kind && i.status!=='protected'?`<button data-act="delete" class="danger" title="command to back up and delete">Delete</button>`:''].join(' ');
    return `<tr class="${ign?'ign':''} ${ost.sel.has(i.id)?'sel':''}" data-oid="${esc(i.id)}">
      <td class="ck"><input type="checkbox" data-sel ${ost.sel.has(i.id)?'checked':''} aria-label="select ${esc(label(i))}"></td>
      <td><span class="badge o-${st}" title="${esc((BADGE[st]||[])[1]||'')}">${esc((BADGE[st]||[st])[0])}</span></td>
      <td><div class="name">${esc(i.name)}</div>${subLine([esc(i.kind),i.namespace?esc(i.namespace):'cluster-scoped'])}</td>
      <td class="hide-sm">${why}</td>
      <td class="hide-sm"><span class="sub" title="${esc(i.created||'')}">${age(i.created)}</span></td>
      <td class="acts">${acts}</td></tr>`;
  }).join(''):`<tr><td colspan="6" class="empty">${d.scanned_at?'Nothing matches these filters.':(d.scanning?'kor is scanning the cluster, which takes a few minutes.':'No orphan scan yet.')}</td></tr>`;
}

function dispatch(a, ids){ return a==='ignore'?doIgnore(ids):a==='unignore'?doUnignore(ids):a==='rules'?showRules():doCommands(ids,a); }

  const tab=e.target.closest('.tab'); if(tab){ setView(tab.dataset.view); return; }
  if(!e.target.closest('#v-orphans')) return;
  const t=e.target.closest('[data-ot]'); if(t){ const k=t.dataset.ot; ost.tile=ost.tile===k?'':k; renderO(); refocus(`#o-strip .headline [data-ot="${k}"]`); return; }

  const act=e.target.closest('[data-act]'); if(act){ const id=act.closest('tr').dataset.oid;
    run(()=>dispatch(act.dataset.act,[id])); return; }

document.addEventListener('change',e=>{
  if(e.target.matches('[data-sel]')){ const id=e.target.closest('tr').dataset.oid; e.target.checked?ost.sel.add(id):ost.sel.delete(id); renderO(); refocus(`tr[data-oid="${CSS.escape(id)}"] [data-sel]`); }

// GET /api/config: the image and Helm rules in effect (config file + dashboard rules, which replace the
// file's entry for the same key) and the rest of the config, read-only. Rules are saved on kube-drift's
// volume and start a version rescan.
const cst = { data:null };
const SECTION = {
  images:{ title:'Image rules', noun:'image rule', keyLabel:'Image',
    help:'Per container image: which versions to offer, where newer ones come from, and how the row reads.',
    keyHelp:'The image without its tag: <code>host/path</code>, just the path for Docker Hub (<code>mongo</code>, <code>grafana/grafana</code>), or <code>re:&lt;regex&gt;</code> for many images.' },
  helm:{ title:'Helm rules', noun:'Helm rule', keyLabel:'Release or chart',
    help:'Per Helm release: where the chart is published, and which versions to offer.',
    keyHelp:'The release name, <code>release@namespace</code> when two releases share a name, the chart name to cover every release of it, or <code>re:&lt;regex&gt;</code>.' },
};
const SETTING = { cluster_name:'Cluster name', scan_interval_hours:'Version scan interval (hours)', auth:'Sign-in', probes:'Version probes',
  registries:'Registries', runtimes:'Container runtimes', static_pod_namespaces:'Static pod namespaces', ignore:'Ignored workloads',
  ignore_images:'Ignored images', groups:'Workload groups', orphans:'Orphaned resources', argocd:'Argo CD' };
// The dashboard row a component's rule lives under, and the key a new rule for it would use.
function ruleKey(c){
  if(c.category==='helm') return c.name;
  if(!c.image_repo) return '';
  return c.image_host && c.image_host!=='docker.io'? `${c.image_host}/${c.image_repo}` : c.image_repo.replace(/^library\//,'');
}
const sectionOf = c => c.category==='helm'?'helm':'images';
function safeLink(u){ return /^https?:\/\//i.test(u||'')?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`:esc(u); }
function describeCfgSource(sec,s){
  if(!s) return sec==='helm'?'From an ArtifactHub search by chart name':'From newer tags in its registry';
  switch(s.type){
    case 'none': return 'Newer versions not looked up';
    case 'github': return `From GitHub releases of ${esc(s.repo)}`+(s.version_regex?`, version from <code>${esc(s.version_regex)}</code>`:'');
    case 'artifacthub': return `From ArtifactHub ${esc(s.repo)}/${esc(s.chart||'(chart name)')}`;
    case 'oci': return `From chart tags at <code>${esc(s.ref)}</code>`;
    default: return `Source <code>${esc(JSON.stringify(s))}</code>`;
  }
}
function describeCfgRule(sec,r){
  const known=new Set(['track','source','ref','name','note','loose_suffix']), out=[];
  if(r.track&&r.track!=='any') out.push(`<b>Same ${esc(r.track)} version only</b>`);
  out.push(describeCfgSource(sec,r.source));
  if(r.name) out.push(`Shown as “${esc(r.name)}”`);
  if(r.note) out.push(`Note: ${esc(r.note)}`);
  if(r.loose_suffix!==undefined) out.push(r.loose_suffix?'Tags compared by their version part only':'Whole tags compared');
  if(r.ref) out.push('Release notes: '+safeLink(r.ref));
  const extra=Object.keys(r).filter(k=>!known.has(k));
  if(extra.length) out.push(`<code>${esc(JSON.stringify(Object.fromEntries(extra.map(k=>[k,r[k]]))))}</code>`);
  return out.map(x=>`<div>${x}</div>`).join('');
}
function usedBy(ids){
  if(!ids.length) return '<span class="hint" title="No row matched this rule in the last scan">none in the last scan</span>';
  const comps=state.data?.components||[], names=ids.map(id=>{ const c=comps.find(x=>x.id===id); return c?`${c.name}${c.namespace&&c.namespace!=='-'?' ('+c.namespace+')':''}`:id; });
  return `${ids.length} row${ids.length===1?'':'s'}<div class="sub" title="${esc(names.join('\n'))}">${esc(names.slice(0,3).join(', '))}${names.length>3?` +${names.length-3}`:''}</div>`;
}
function renderC(){
  const d=cst.data; if(!d) return;
  const ed=d.editable, ndash=d.images.concat(d.helm).filter(e=>e.from==='dashboard').length;
  const env=Object.entries(d.env||{}).map(([k,v])=>`<code>${esc(k)}=${esc(v)}</code>`).join(', ');
  let h=`<p class="intro">kube-drift reads its config from <code>${esc(d.file)}</code>${env?`, with ${env} set in its environment`:''}. `+
    `Image and Helm rules can also be added here: they're kept on kube-drift's volume, apply from the next version scan, and replace the config file's entry for the same key. Everything else is changed in the config file.</p>`;
  if(!ed) h+=`<div class="banner">Rules can't be saved here: the data directory isn't writable.</div>`;
  for(const sec of ['images','helm']){
    const S=SECTION[sec], rows=d[sec];
    h+=`<h2 class="ch">${S.title}${ed?` <button type="button" data-cadd="${sec}">Add ${S.noun}</button>`:''}</h2><p class="hint">${S.help} ${S.keyHelp.replace(/^The/,'Key: the')}</p>`;
    h+=`<div class="tablewrap"><table><thead><tr><th style="min-width:11em">${S.keyLabel}</th><th>Settings</th><th class="hide-sm">Used by</th><th style="width:1%"></th></tr></thead><tbody>`+
      (rows.length?rows.map(e=>{
        const dash=e.from==='dashboard', ref=`data-sec="${sec}" data-key="${esc(e.key)}"`;
        const from=dash?`<span class="from dash" title="${e.replaces?esc('Replaces the config file’s '+JSON.stringify(e.replaces)):''}">dashboard${e.replaces?', replaces config file':''}</span> <span class="sub">${e.by?esc(e.by)+', ':''}${rel(e.at)}</span>`
          :'<span class="from">config file</span>';
        const acts=!ed?'':dash?`<button type="button" data-cedit ${ref}>Edit…</button> <button type="button" class="danger" data-cdel ${ref}>${e.replaces?'Revert':'Remove'}</button>`
          :`<button type="button" data-cedit ${ref} title="Make a dashboard rule that replaces this entry">Override…</button>`;
        return `<tr><td><div class="ckey">${esc(e.key)}</div>${from}</td><td>${describeCfgRule(sec,e.rule)}</td><td class="hide-sm">${usedBy(e.components)}</td><td class="acts">${acts}</td></tr>`;
      }).join(''):`<tr><td colspan="4" class="empty">No ${S.noun}s: every ${sec==='helm'?'release':'image'} uses the defaults.${ed?` Add one here, or with <b>Configure…</b> on a row in Version drift.`:''}</td></tr>`)+
      '</tbody></table></div>';
  }
  if(d.dashboard_yaml) h+=`<h2 class="ch">Move dashboard rules into the config file <button type="button" id="c-copy">Copy YAML</button> <span class="hint" id="c-copied"></span></h2>
    <p class="hint">Paste under the config file's <code>images:</code> and <code>helm:</code>, apply it, then remove the dashboard rules here.</p>
    <div class="tablewrap" style="padding:10px 12px"><pre class="cfg" id="c-yaml">${esc(d.dashboard_yaml)}</pre></div>`;
  const keys=Object.keys(d.settings||{});
  h+=`<h2 class="ch">Everything else in the config file</h2><p class="hint">Read-only here. Values that look secret, probe headers and passwords in URLs show as (hidden). Keys not listed use their defaults (<a href="https://github.com/opswhisperer/kube-drift/blob/main/config/example.yaml" target="_blank" rel="noopener">config/example.yaml</a>).</p>`+
    (keys.length?`<div class="cset">${keys.map(k=>`<section><h3>${esc(SETTING[k]||k)}<code>${esc(k)}</code></h3><pre class="cfg">${esc(d.settings_yaml[k])}</pre></section>`).join('')}</div>`
      :'<p class="hint">Nothing: kube-drift runs on its defaults.</p>');
  $('#c-body').innerHTML=h;
}
async function loadC(){ try{ cst.data=await get('/api/config'); if(ost.view==='config') renderC(); }catch(e){ if(ost.view==='config') $('#c-body').innerHTML=`<p class="hint">Cannot load the config: ${esc(e.message||e)}</p>`; } }

// The rule editor. `orig` is the dashboard key being edited (renaming it replaces that rule).
async function editRule(sec, {key='', rule={}, orig=null, note=''}={}){
  const S=SECTION[sec], s=rule.source||{}, t=s.type||'';
  const fileHas=k=>(cst.data?.[sec]||[]).some(e=>e.key===k && (e.from==='config'||e.replaces));
  const opt=(v,l,cur)=>`<option value="${v}" ${v===cur?'selected':''}>${l}</option>`;
  const srcs=sec==='images'?[['','Newer tags in its registry (default)'],['github','GitHub releases'],['none','Don’t look it up']]
    :[['','ArtifactHub search by chart name (default)'],['artifacthub','An ArtifactHub repository'],['oci','An OCI registry'],['github','GitHub releases'],['none','Don’t look it up']];
  const loose=rule.loose_suffix===true?'1':rule.loose_suffix===false?'0':'';
  const body=`${note?`<p>${note}</p>`:''}<div class="cform">
    <label>${S.keyLabel} <input type="text" id="cf-key" value="${esc(key)}" required spellcheck="false" autocomplete="off">
      <span class="hint">${S.keyHelp}</span><span class="hint" id="cf-keynote"></span></label>
    <label>Versions to offer <select id="cf-track">${opt('any','Any newer version',rule.track||'any')}${opt('minor','Same minor version only (patches)',rule.track)}${opt('major','Same major version only',rule.track)}</select>
      <span class="hint">The newest overall still shows as “outside your track”.</span></label>
    <label>Newer versions from <select id="cf-src">${srcs.map(([v,l])=>opt(v,l,t)).join('')}</select></label>
    <label data-for="github">GitHub repository <input type="text" id="cf-gh" value="${esc(t==='github'?s.repo:'')}" placeholder="owner/name" spellcheck="false"></label>
    <label data-for="github">Version from release names (optional) <input type="text" id="cf-vre" value="${esc(s.version_regex||'')}" placeholder="n8n@(\\d+\\.\\d+\\.\\d+)" spellcheck="false">
      <span class="hint">A regex whose first group is the version, for releases named like <code>n8n@1.2.3</code>.</span></label>
    <div class="pair" data-for="artifacthub"><label>ArtifactHub repository <input type="text" id="cf-ah" value="${esc(t==='artifacthub'?s.repo:'')}" placeholder="bitnami" spellcheck="false"></label>
      <label>Chart (optional) <input type="text" id="cf-chart" value="${esc(s.chart||'')}" placeholder="the installed chart's name" spellcheck="false"></label></div>
    <label data-for="oci">Chart in an OCI registry <input type="text" id="cf-oci" value="${esc(s.ref||'')}" placeholder="docker.io/envoyproxy/gateway-helm" spellcheck="false"></label>
    <label>Release notes link (optional) <input type="url" id="cf-ref" value="${esc(rule.ref||'')}" placeholder="https://github.com/org/app/releases"></label>
    ${sec==='images'?`<div class="pair"><label>Show as (optional) <input type="text" id="cf-name" value="${esc(rule.name||'')}" maxlength="200" placeholder="the workload's name"></label>
      <label>Note (optional) <input type="text" id="cf-note" value="${esc(rule.note||'')}" maxlength="200"></label></div>
    <label>Tag suffixes <select id="cf-loose">${opt('','Default (version part only for your own registries)',loose)}${opt('1','Compare the version part only (1.4.2-a1b2c3-r1)',loose)}${opt('0','Compare whole tags',loose)}</select></label>`:''}
  </div>`;
  const p=modal({title:orig?`Edit ${S.noun}`:fileHas(key)?`Override ${S.noun}`:`Add ${S.noun}`, ok:'Save', body});
  const sync=()=>{ const v=$('#cf-src').value; document.querySelectorAll('.cform [data-for]').forEach(el=>el.hidden=!el.dataset.for.split(' ').includes(v));
    const k=$('#cf-key').value.trim(); $('#cf-keynote').textContent=k && fileHas(k)?'The config file has a rule for this key: saving replaces it until you revert.':''; };
  $('#cf-src').addEventListener('change',sync); $('#cf-key').addEventListener('input',sync); sync(); if(!key) $('#cf-key').focus();
  const r=await p; if(!r.ok) return;
  const v=id=>($('#'+id)?.value||'').trim(), out={}, src=v('cf-src');
  if(v('cf-track')!=='any') out.track=v('cf-track');
  if(src==='none') out.source={type:'none'};
  else if(src==='github'){ out.source={type:'github',repo:v('cf-gh')}; if(v('cf-vre')) out.source.version_regex=v('cf-vre'); if(t==='github'&&s.prefer_tags) out.source.prefer_tags=true; }
  else if(src==='artifacthub'){ out.source={type:'artifacthub',repo:v('cf-ah')}; if(v('cf-chart')) out.source.chart=v('cf-chart'); }
  else if(src==='oci') out.source={type:'oci',ref:v('cf-oci')};
  if(v('cf-ref')) out.ref=v('cf-ref');
  if(sec==='images'){ if(v('cf-name')) out.name=v('cf-name'); if(v('cf-note')) out.note=v('cf-note'); if(v('cf-loose')) out.loose_suffix=v('cf-loose')==='1'; }
  const newKey=v('cf-key');
  try{
    await call('/api/config/rules',{section:sec,key:newKey,rule:out});
    if(orig && orig!==newKey) await call('/api/config/rules/delete',{section:sec,key:orig});
  }catch(e){ toast('Not saved: '+esc(e.message),8000); return editRule(sec,{key:newKey,rule:out,orig,note}); }
  toast(`Saved ${esc(newKey)}. Rescanning versions…`);
  await loadC(); setTimeout(()=>{ load(); loadC(); },1500);
}
async function configure(id){
  const c=(state.data?.components||[]).find(x=>x.id===id); if(!c) return;
  if(!cst.data) await loadC();
  const sec=sectionOf(c), key=c.config_key||ruleKey(c), e=(cst.data?.[sec]||[]).find(x=>x.key===key);
  const what=c.category==='helm'?`release ${esc(c.name)}`:`<code>${esc(c.image)}</code>`;
  const note=c.config_key?.startsWith('re:')?`${what} uses the rule <code>${esc(c.config_key)}</code>, which covers every ${sec==='helm'?'release':'image'} it matches. Change the key to make a rule for this one only.`
    :c.category==='helm'?`For ${what}. Use <code>${esc(c.name)}@${esc(c.namespace)}</code> as the key if another release shares its name, or the chart name to cover all of its releases.`:`For ${what}, wherever it runs.`;
  await editRule(sec,{key, rule:e?e.rule:{}, orig:e?.from==='dashboard'?key:null, note});
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#v-config')) return;
  const add=e.target.closest('[data-cadd]'); if(add){ run(()=>editRule(add.dataset.cadd)); return; }
  const ed=e.target.closest('[data-cedit]'); if(ed){ const sec=ed.dataset.sec, x=cst.data[sec].find(r=>r.key===ed.dataset.key); if(!x) return;
    run(()=>editRule(sec,{key:x.key, rule:x.rule, orig:x.from==='dashboard'?x.key:null,
      note:x.from==='config'?'Saving makes a dashboard rule that replaces this config file entry; <b>Revert</b> brings the file’s back.':''})); return; }
  const del=e.target.closest('[data-cdel]'); if(del){ const {sec,key}=del.dataset;
    if(!confirm(`${del.textContent} the ${SECTION[sec].noun} “${key}”?`)) return;
    run(async()=>{ await call('/api/config/rules/delete',{section:sec,key}); toast(`${del.textContent==='Revert'?'Reverted':'Removed'} ${esc(key)}. Rescanning versions…`); await loadC(); setTimeout(()=>{ load(); loadC(); },1500); }); return; }
  if(e.target.id==='c-copy'){ navigator.clipboard.writeText(cst.data.dashboard_yaml).then(()=>{ $('#c-copied').textContent='Copied.'; },
    ()=>{ const r=document.createRange(); r.selectNodeContents($('#c-yaml')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); $('#c-copied').textContent='Selected — press ⌘C / Ctrl+C.'; }); }
});

/* ------------------------------------------------------------------ sign-in and API keys */
async function whoami(){
  try{ const me=await (await fetch('/auth/me',{cache:'no-store'})).json(); if(me.auth!=='oidc'||me.via!=='session') return;
    $('#who-name').textContent=me.user?.name||me.user?.email||''; $('#who-name').title=me.user?.email||''; $('#who').hidden=false; }catch{}
}
$('#signout').addEventListener('click',()=>run(async()=>{ const res=await call('/auth/logout',{}); location.href=res.redirect||'/'; }));
$('#keys').addEventListener('click',()=>run(showKeys));
const EXPIRY=[[90,'Expires in 90 days'],[30,'Expires in 30 days'],[365,'Expires in a year'],[0,'Never expires']];
async function showKeys(created){
  const {keys}=await get('/api/keys');
  const rows=keys.map(k=>`<tr><td><div>${esc(k.name)} <code class="sub">${esc(k.prefix)}…</code></div>
    <div class="sub">by ${esc(k.created_by||'?')}, ${rel(k.created_at)} · ${k.last_used_at?'used '+rel(k.last_used_at):'never used'}${k.expires_at?' · expires '+esc(k.expires_at.slice(0,10)):''}</div></td>
    <td><button type="button" class="danger" data-key-del="${esc(k.id)}" data-key-name="${esc(k.name)}">Revoke</button></td></tr>`).join('');
  const fresh=created?`<div class="warn">Copy this key now; kube-drift keeps only its hash and can't show it again.</div>
    <div style="margin-top:10px"><button type="button" class="primary" id="dlg-copy">Copy key</button> <span class="hint" id="dlg-copied"></span></div>
    <pre class="script" id="dlg-script">${esc(created)}</pre>`:'';
  const p=modal({title:'API keys', ok:null, body:`${fresh}<p>For scripts and agents: send <code>Authorization: Bearer &lt;key&gt;</code> to <code>/api/…</code>. A key can read and change what the dashboard can, except API keys.</p>
    <div class="newkey"><input type="text" id="key-name" maxlength="100" placeholder="What it's for, e.g. renovate-bot" aria-label="key name">
    <select id="key-days" aria-label="expiry">${EXPIRY.map(([d,l])=>`<option value="${d}">${l}</option>`).join('')}</select>
    <button type="button" class="primary" id="key-new">Create key</button></div>
    ${keys.length?`<table class="rules">${rows}</table>`:'<p class="hint">No keys yet.</p>'}`});
  const cb=$('#dlg-copy'); if(cb) cb.addEventListener('click',async()=>{ $('#dlg-copied').textContent=await copyText(created)?'Copied.':'Selected — press ⌘C / Ctrl+C.'; });
  await p;
}
document.addEventListener('click',e=>{
  if(e.target.id==='key-new'){ const name=$('#key-name').value.trim(); if(!name){ $('#key-name').focus(); return; }
    const days=parseInt($('#key-days').value,10);
    run(async()=>{ const res=await call('/api/keys',days?{name,days}:{name}); $('#dlg').close(); showKeys(res.token); }); return; }
  const del=e.target.closest('[data-key-del]'); if(!del) return;
  if(!confirm(`Revoke "${del.dataset.keyName}"? Anything using it stops working.`)) return;
  run(async()=>{ await call('/api/keys/delete',{id:del.dataset.keyDel}); $('#dlg').close(); toast('Key revoked'); showKeys(); });
});

whoami();
if(location.hash==='#orphans'||location.hash==='#config') setView(location.hash.slice(1));
load(); loadO(); setInterval(()=>{ load(); loadO(); if(ost.view==='config') loadC(); }, 60000);
</script>
