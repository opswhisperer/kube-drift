# Dev builds on a self-hosted Forgejo copy of this repo (GitHub ignores .forgejo/). Every branch push
# runs the tests, then builds linux/amd64 and pushes <forgejo host>/<owner>/kube-drift:dev-<sha12>.
# Releases are not built here: tags v* build multi-arch on GitHub (.github/workflows/ci.yml).
# Needs, on the Forgejo org or repo: secret REGISTRY_TOKEN (write:package) and variable REGISTRY_USER.
name: dev

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    container:
      image: python:3.12-alpine
    steps:
      - run: apk add --no-cache git nodejs   # actions/checkout needs node
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'

  image:
    needs: test
    runs-on: docker
    container:
      image: docker:28-cli
    steps:
      - run: apk add --no-cache git nodejs
      - uses: actions/checkout@v4
      - name: Build and push
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
        run: |
          set -eu
          host=${GITHUB_SERVER_URL#*://}
          tag=dev-$(echo "$GITHUB_SHA" | cut -c1-12)
          image="$host/$GITHUB_REPOSITORY:$tag"
          echo "$REGISTRY_TOKEN" | docker login "$host" -u "$REGISTRY_USER" --password-stdin
          docker buildx build --platform linux/amd64 --push \
            --build-arg VERSION="$tag" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$image" .
          echo "pushed $image"
